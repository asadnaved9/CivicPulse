services:
  - type: web
    name: hackquest-app
    env: node
    plan: free # Change this to standard if you need more resources
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Add any other environment variables your app needs below
    # - key: DATABASE_URL
    #   sync: false
